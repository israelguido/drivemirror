[package]
name = "drivemirror"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Mirror a local folder to a private rclone remote"

[dependencies]
directories = "6"
gtk = { package = "gtk4", version = "0.10" }
ksni = { version = "0.3", features = ["blocking"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"

[dev-dependencies]
tempfile = "3"

