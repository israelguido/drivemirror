[package]
name = "drivemirror"
version = "0.3.0"
edition = "2024"
license = "MIT"
description = "Mirror a local folder to a private rclone remote"

[dependencies]
directories = "6"
gtk = { package = "gtk4", version = "0.10" }
gtk4-layer-shell = "0.7"
ksni = { version = "0.3", features = ["blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.2"

[dev-dependencies]
tempfile = "3"

